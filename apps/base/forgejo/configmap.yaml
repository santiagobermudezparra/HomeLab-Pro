apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-config
  namespace: forgejo
data:
  # Database configuration
  FORGEJO__database__DB_TYPE: "postgres"
  FORGEJO__database__HOST: "forgejo-postgres-rw.forgejo.svc.cluster.local:5432"
  FORGEJO__database__NAME: "forgejo"
  FORGEJO__database__USER: "forgejo"

  # Server configuration
  FORGEJO__server__ROOT_URL: "https://forgejo.watarystack.org/"
  FORGEJO__server__DOMAIN: "forgejo.watarystack.org"
  FORGEJO__server__HTTP_PORT: "3000"
  FORGEJO__server__SSH_DOMAIN: "forgejo.watarystack.org"
  FORGEJO__server__DISABLE_SSH: "true"
  FORGEJO__server__OFFLINE_MODE: "false"

  # Security — lock installer, no public registration
  FORGEJO__security__INSTALL_LOCK: "true"

  # Service — disable public registration
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
  FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"

  # Logging
  FORGEJO__log__LEVEL: "Info"
  FORGEJO__log__MODE: "console"
