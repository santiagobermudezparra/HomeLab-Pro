apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wallabag-postgres
  namespace: wallabag
spec:
  description: "PostgreSQL cluster for Wallabag application"
  instances: 1

  # monitoring:
  #   enabled: true
  #   podMonitorEnabled: true

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"

  storage:
    size: 2Gi
    pvcTemplate:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi

  superuserSecret:
    name: wallabag-superuser

  bootstrap:
    initdb:
      database: wallabag
      owner: wallabag
      secret:
        name: wallabag-db-credentials

  backup:
    barmanObjectStore:
      destinationPath: "s3://homelab-postgres-backup/wallabag"
      endpointURL: "https://cf504e28de7836d9611b6774cdcb303e.r2.cloudflarestorage.com"
      s3Credentials:
        accessKeyId:
          name: wallabag-backup-s3-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: wallabag-backup-s3-secret
          key: ACCESS_KEY_SECRET
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "7d"
